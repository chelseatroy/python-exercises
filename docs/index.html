<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intro Examples Polls</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%228%22 width=%223%22 height=%226%22 fill=%22%233a6ad6%22/%3E%3Crect x=%226.5%22 y=%224%22 width=%223%22 height=%2210%22 fill=%22%233a6ad6%22/%3E%3Crect x=%2211%22 y=%222%22 width=%223%22 height=%2212%22 fill=%22%233a6ad6%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --ink: #1d1c1a;
      --ink-2: #57544e;
      --ink-3: #6f6b64;
      --line: #e2dfd8;
      --code-bg: #f1efe9;
      --accent: #2f5fd0;
      --accent-ink: #ffffff;
      --bar: #3a6ad6;
      --track: #ebe8e1;
      --warn-bg: #fff4d6;
      --warn-ink: #5c4200;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #151514;
        --surface: #1f1f1d;
        --ink: #eeece7;
        --ink-2: #b9b5ad;
        --ink-3: #9a968e;
        --line: #34332f;
        --code-bg: #282725;
        --accent: #7fa2f5;
        --accent-ink: #10131a;
        --bar: #6f95ee;
        --track: #2e2d2a;
        --warn-bg: #3a2f10;
        --warn-ink: #f4dd9c;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #151514;
      --surface: #1f1f1d;
      --ink: #eeece7;
      --ink-2: #b9b5ad;
      --ink-3: #9a968e;
      --line: #34332f;
      --code-bg: #282725;
      --accent: #7fa2f5;
      --accent-ink: #10131a;
      --bar: #6f95ee;
      --track: #2e2d2a;
      --warn-bg: #3a2f10;
      --warn-ink: #f4dd9c;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.5 Inter, system-ui, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
    header h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
    header p { margin: 0; color: var(--ink-2); max-width: 60ch; }
    code, pre { font-family: "JetBrains Mono", ui-monospace, monospace; }

    .banner {
      margin: 24px 0 0;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn-ink);
      font-weight: 500;
    }

    #polls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 32px; }
    .poll {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      scroll-margin-top: 16px;
    }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    pre {
      margin: 0 0 20px;
      padding: 16px;
      background: var(--code-bg);
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    .question { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; padding: 0; }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .option:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .option:has(input:disabled) { cursor: default; }
    .option input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
    .option code { font-size: 0.95rem; overflow-wrap: anywhere; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, .option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status { margin: 12px 0 0; color: var(--ink-2); min-height: 1.5em; }

    .results { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
    .results h3 { margin: 0 0 16px; font-size: 1rem; font-weight: 600; color: var(--ink-2); }
    .chart { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
    .row-label { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
    .row-label code { font-size: 0.95rem; overflow-wrap: anywhere; }
    .mine {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink-2);
    }
    .track { height: 20px; background: var(--track); border-radius: 4px; overflow: hidden; }
    .bar { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; transition: width 300ms ease; }
    .value { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 0.95rem; min-width: 6.5ch; text-align: right; }

    @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
    @media (max-width: 480px) {
      main { padding-top: 24px; }
      header h1 { font-size: 1.6rem; }
      .poll { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Intro Examples: Reading and Understanding Code</h1>
      <p>Answer each poll as we reach it. After you answer, you can see how the class voted. Responses clear after 24 hours.</p>
    </header>
    <p id="banner" class="banner" role="alert" hidden></p>
    <div id="polls"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
