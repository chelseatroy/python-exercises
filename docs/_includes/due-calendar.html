<script>
(function () {
  var board = document.currentScript.previousElementSibling.querySelector('.due-cal-board');
  var svg = board.querySelector('.cal-arrows');
  var NS = 'http://www.w3.org/2000/svg';
  function draw() {
    var box = board.getBoundingClientRect();
    svg.setAttribute('width', box.width);
    svg.setAttribute('height', box.height);
    svg.innerHTML = '';
    var defs = document.createElementNS(NS, 'defs');
    svg.appendChild(defs);
    var made = {};
    board.querySelectorAll('.cal-label').forEach(function (label) {
      var target = document.getElementById(label.dataset.to);
      if (!target) return;
      var color = label.dataset.color;
      var id = 'cal-head-' + color.slice(1);
      if (!made[id]) {
        var marker = document.createElementNS(NS, 'marker');
        marker.setAttribute('id', id);
        marker.setAttribute('viewBox', '0 0 10 10');
        marker.setAttribute('refX', '9');
        marker.setAttribute('refY', '5');
        marker.setAttribute('markerWidth', '5');
        marker.setAttribute('markerHeight', '5');
        marker.setAttribute('orient', 'auto');
        var tip = document.createElementNS(NS, 'path');
        tip.setAttribute('d', 'M0,0 L10,5 L0,10 z');
        tip.setAttribute('fill', color);
        marker.appendChild(tip);
        defs.appendChild(marker);
        made[id] = true;
      }
      var a = label.getBoundingClientRect(), b = target.getBoundingClientRect();
      var fromLeft = label.parentNode.classList.contains('cal-left');
      var x1 = (fromLeft ? a.right : a.left) - box.left;
      var x2 = (fromLeft ? b.left - 2 : b.right + 2) - box.left;
      // Level with the target when the label spans its height; otherwise from the label's middle.
      var y2 = b.top + b.height / 2;
      var y1 = Math.min(Math.max(y2, a.top + 6), a.bottom - 6);
      var line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1 - box.top);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2 - box.top);
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', '3');
      line.setAttribute('marker-end', 'url(#' + id + ')');
      svg.appendChild(line);
    });
  }
  draw();
  window.addEventListener('load', draw);
  if (window.ResizeObserver) new ResizeObserver(draw).observe(board);
})();
</script>
